<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="10">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Cotação do Dólar</title>
</head>

<body>

    <main class="card">
        <p class="eyebrow">USD &rarr; BRL</p>
        <h1>Cotação do Dólar</h1>

        <div class="valor-atual">
            <span id="valorAtual">Carregando...</span>
            <span class="variacao" id="variacao"></span>
        </div>

        <div class="stats">
            <div class="stat-box stat-alta">
                <span class="stat-label">Maior do dia</span>
                <strong id="valorMaximo">--</strong>
            </div>
            <div class="stat-box stat-baixa">
                <span class="stat-label">Menor do dia</span>
                <strong id="valorMinimo">--</strong>
            </div>
        </div>

        <p class="atualizacao" id="ultimaAtualizacao">Buscando dados...</p>
        <p class="aviso">Esta página recarrega automaticamente a cada 10 segundos.</p>
    </main>

    <script src="script.js"></script>
</body>

</html>
